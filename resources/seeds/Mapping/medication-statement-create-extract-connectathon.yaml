id: medication-statement-create-extract-connectathon
resourceType: Mapping
type: FHIRPath
body:
  "{% assign %}":
    - id: "{{ %QuestionnaireResponse.answers('medication-statement-id') }}"
    - patientRef: "{{ %QuestionnaireResponse.answers('patient') }}"
    - status: "{{ %QuestionnaireResponse.answers('status') }}"
    - statusCode: "{{ %status.code }}"
    - statusReason: "{{ %QuestionnaireResponse.answers('status-reason') }}"
    - category: "{{ %QuestionnaireResponse.answers('category') }}"
    - medicationCode: "{{ %QuestionnaireResponse.answers('medication') }}"
    - reasonCodes: "{[ %QuestionnaireResponse.item.where(linkId='reason-code').answer.valueCoding ]}"
    - effectiveDateTime: "{{ %QuestionnaireResponse.answers('effective-date-time') }}"
    - encounterRef: "{{ %QuestionnaireResponse.answers('encounter') }}"
    - dosage: "{{ %QuestionnaireResponse.answers('dosage') }}"
    - note: "{{ %QuestionnaireResponse.answers('note') }}"
    - medicationDisplay: "{{ %medicationCode.display | %medicationCode.text }}"
    - narrativeDiv: "<div xmlns='http://www.w3.org/1999/xhtml'>PH Core MedicationStatement — {{ %medicationDisplay }} — status {{ %statusCode }}.</div>"
    - addMedicationStatement:
        request:
          "{% if %id.exists() %}":
            url: /MedicationStatement/{{ %id }}
            method: PUT
          "{% else %}":
            url: /MedicationStatement
            method: POST
        resource:
          resourceType: MedicationStatement
          meta:
            profile:
              - https://fhir.doh.gov.ph/phcore/StructureDefinition/ph-core-medicationstatement
          id: "{{ %id }}"
          status: "{{ %statusCode }}"
          subject: "{{ %patientRef }}"
          medicationCodeableConcept:
            coding:
              - "{{ %medicationCode }}"
            text: "{{ %medicationDisplay }}"
          text:
            status: generated
            div: "{{ %narrativeDiv }}"
          statusReason:
            - "{% if %statusReason.exists() %}":
                coding:
                  - "{{ %statusReason }}"
                text: "{{ %statusReason.display }}"
          category:
            "{% if %category.exists() %}":
              coding:
                - "{{ %category }}"
              text: "{{ %category.display }}"
          reasonCode:
            - "{% for reasonCode in %reasonCodes %}":
                coding:
                  - "{{ %reasonCode }}"
                text: "{{ %reasonCode.display }}"
          effectiveDateTime: "{{ %effectiveDateTime }}"
          context: "{{ %encounterRef }}"
          dosage:
            - "{% if %dosage.exists() %}":
                text: "{{ %dosage }}"
          note:
            - "{% if %note.exists() %}":
                text: "{{ %note }}"
  resourceType: Bundle
  type: transaction
  entry:
    - "{{ %addMedicationStatement }}"
