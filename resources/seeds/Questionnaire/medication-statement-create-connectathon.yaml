resourceType: Questionnaire
id: medication-statement-create-connectathon
name: medication-statement-create-connectathon
title: Medication statement create PH
status: active
url: medication-statement-create
subjectType:
  - Patient
meta:
  profile:
    - https://emr-core.beda.software/StructureDefinition/fhir-emr-questionnaire
mapping:
  - reference: Mapping/medication-statement-create-extract-connectathon
launchContext:
  - name:
      code: MedicationStatement
    type:
      - MedicationStatement
item:
  - linkId: medication-statement-id
    text: MedicationStatementId
    type: string
    hidden: true
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.id"

  - linkId: patient
    text: Patient
    type: reference
    required: true
    referenceResource:
      - Patient
    answerExpression:
      language: application/x-fhir-query
      expression: Patient
    choiceColumn:
      - forDisplay: true
        path: name.given.first() + ' ' + name.family.first()
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.subject"

  - linkId: status
    text: Status
    type: choice
    required: true
    answerOption:
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: active
          display: Active
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: completed
          display: Completed
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: stopped
          display: Stopped
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: on-hold
          display: On Hold
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: entered-in-error
          display: Entered in Error
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: intended
          display: Intended
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: not-taken
          display: Not Taken
      - valueCoding:
          system: http://hl7.org/fhir/CodeSystem/medication-statement-status
          code: unknown
          display: Unknown
    initialExpression:
      language: text/fhirpath
      expression: "iif(%MedicationStatement.status.exists(), %Questionnaire.repeat(item).where(linkId='status').answerOption.valueCoding.where(code=%MedicationStatement.status).first(), %Questionnaire.repeat(item).where(linkId='status').answerOption.valueCoding.where(code='active').first())"

  - linkId: status-reason
    text: Status reason
    type: choice
    answerValueSet: http://hl7.org/fhir/ValueSet/reason-medication-status-codes
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.statusReason.first().coding.first()"

  - linkId: category
    text: Category
    type: choice
    answerValueSet: http://hl7.org/fhir/ValueSet/medication-statement-category
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.category.coding.first()"

  - linkId: medication
    text: Medication
    type: choice
    required: true
    # TODO: uncomment answerValueSet when tx.fhirlab.net expands drugs-vs
    # answerValueSet: https://fhir.doh.gov.ph/phcore/ValueSet/drugs-vs
    answerOption:
      - valueCoding:
          system: https://verification.fda.gov.ph
          code: DRP-10144
          display: Twinact
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.medicationCodeableConcept.coding.first()"

  - linkId: reason-code
    text: Reason
    type: choice
    repeats: true
    answerValueSet: http://hl7.org/fhir/ValueSet/condition-code
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.reasonCode.coding"

  - linkId: effective-date-time
    text: Effective date and time
    type: dateTime
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.effectiveDateTime"

  - linkId: encounter
    text: Encounter
    type: reference
    referenceResource:
      - Encounter
    answerExpression:
      language: application/x-fhir-query
      expression: "Encounter?patient={{%QuestionnaireResponse.repeat(item).where(linkId='patient').answer.valueReference.reference}}"
    choiceColumn:
      - forDisplay: true
        path: class.display + ' - ' + period.start.toString().split('.')[0].split('T')[0] + ' ' + period.start.toString().split('.')[0].split('T')[1]
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.context"

  - linkId: dosage
    text: Dosage
    type: string
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.dosage.first().text"

  - linkId: note
    text: Note
    type: text
    initialExpression:
      language: text/fhirpath
      expression: "%MedicationStatement.note.text.first()"
