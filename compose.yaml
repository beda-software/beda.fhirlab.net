services:
  ig-downloader:
    image: curlimages/curl:latest
    volumes:
      - ./resources/ig2:/output/ig2
    entrypoint: >
      sh -c "
        curl -fsSL -o /tmp/package.tgz https://build.fhir.org/ig/UP-Manila-SILab/ph-core/package.tgz &&
        cp /tmp/package.tgz /output/ig2/0.2.0-ci-build.tgz
      "
  sdc:
    image: bedasoftware/fhir-sdc:2.1.0a6
    depends_on:
      devbox:
        condition: service_healthy
    env_file:
      - ./env/sdc
  patch-init-bundle:
    image: alpine:latest
    depends_on:
      build-seeds:
        condition: service_completed_successfully
    entrypoint: sh
    command:
      - -c
      - >-
        apk add --no-cache jq -q &&
        jq '.entry[0].request.method = "POST" | .entry[0].request.url = "/AidboxMigration"'
        /app/init-bundles/initBundle.json > /tmp/initBundle.json &&
        mv /tmp/initBundle.json /app/init-bundles/initBundle.json
    volumes:
      - ./resources/init-bundles:/app/init-bundles
  devbox:
    image: healthsamurai/aidboxone:stable
    depends_on:
      devbox-db:
        condition: service_healthy
      patch-init-bundle:
        condition: service_completed_successfully
      ig-downloader:
        condition: service_completed_successfully
    healthcheck:
      test: curl --fail http://localhost:8080/health || exit 1
      interval: 5s
      timeout: 30s
      retries: 50
    ports:
      - 8080:8080
    env_file:
      - ./env/aidbox
    environment:
      - AIDBOX_LICENSE
    volumes:
      - ./resources/init-bundles:/resources/init-bundles
      - ./resources/ig2:/resources/ig2:ro
  devbox-db:
    image: "postgres:18"
    env_file:
      - ./env/db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  build-seeds:
    image: bedasoftware/fhirsnake:latest
    depends_on:
      ig-downloader:
        condition: service_completed_successfully
    command:
      - export
      - --input
      - /app/resources/ig2
      - --input
      - /app/resources/ig0
      - --input
      - /app/resources/ig1
      - --input
      - /app/resources/seeds
      - --output
      - /app/init-bundles/initBundle.json
      - --external-questionnaire-fce-fhir-converter-url
      - http://questionnaire-fce-fhir-converter:3000/to-fhir
    volumes:
      - ./resources/ig0:/app/resources/ig0:ro
      - ./resources/ig1:/app/resources/ig1:ro
      - ./resources/ig2:/app/resources/ig2:ro
      - ./resources/seeds:/app/resources/seeds:ro
      - ./resources/init-bundles:/app/init-bundles
    env_file:
      - ./env/build-seeds
  watch-seeds:
    image: bedasoftware/fhirsnake:latest
    command:
      - watch
      - --input
      - /app/resources/ig2
      - --input
      - /app/resources/ig0
      - --input
      - /app/resources/ig1
      - --input
      - /app/resources/seeds
      - --external-fhir-server-url
      - http://root:secret@devbox:8080
      - --external-questionnaire-fce-fhir-converter-url
      - http://questionnaire-fce-fhir-converter:3000/to-fhir
    volumes:
      - ./resources/ig0:/app/resources/ig0:ro
      - ./resources/ig1:/app/resources/ig1:ro
      - ./resources/ig2:/app/resources/ig2:ro
      - ./resources/seeds:/app/resources/seeds:ro
    env_file:
      - ./env/build-seeds
  questionnaire-fce-fhir-converter:
    image: bedasoftware/questionnaire-fce-fhir-converter:latest
    healthcheck:
      test: curl --fail http://localhost:3000/health || exit 1
      interval: 5s
      timeout: 30s
      retries: 50
